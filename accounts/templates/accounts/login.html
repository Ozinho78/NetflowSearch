{% extends 'base.html' %}

{% block title %}
  Anmelden – NetflowSearch
{% endblock %}

{% block content %}
  <div class="card auth-card">
    <h1>Anmelden</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_div }}
      <input type="hidden" name="next" value="{{ next }}" />
      <button type="submit" class="btn btn-primary btn-block">Anmelden</button>
    </form>
      <p class="auth-footer">
    Noch kein Konto? <a href="{% url 'accounts:register' %}">Registrieren</a>
  </p>
  </div>
{% endblock %}

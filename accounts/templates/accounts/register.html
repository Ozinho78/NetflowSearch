{% extends "base.html" %}

{% block title %}Registrieren – NetflowSearch{% endblock %}

{% block content %}
<div class="card auth-card">
  <h1>Registrieren</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-primary btn-block">Konto anlegen</button>
  </form>
  <p class="auth-footer">
    Bereits registriert? <a href="{% url 'accounts:login' %}">Anmelden</a>
  </p>
</div>
{% endblock %}
